name: Deploy to Dev

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Dev EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ec2-user/handmade-mini-backend
            git pull origin dev
            mvn clean package -DskipTests
            # Kill existing app
            pkill -f 'pochampally-backend.*jar' || true
            sleep 2
            # Source env vars and start app
            source .env
            nohup java -Xmx512m -Xms256m -jar target/pochampally-backend-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
            sleep 5
            # Verify app started
            if pgrep -f 'pochampally-backend.*jar' > /dev/null; then
              echo "App started successfully"
            else
              echo "App failed to start. Last logs:"
              tail -20 app.log
              exit 1
            fi
