name: Deploy to Dev

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Dev EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            export JAVA_HOME=/usr/lib/jvm/java-21-amazon-corretto.x86_64
            export PATH=$JAVA_HOME/bin:$PATH
            cd /home/ec2-user/handmade-mini-backend
            git pull origin dev
            mvn clean package -DskipTests
            # Kill existing app — try PID file first, then find by process
            if [ -f app.pid ]; then
              kill $(cat app.pid) 2>/dev/null || true
            fi
            # Also kill any remaining java process running our jar
            kill $(pgrep -f 'java.*pochampally-backend' | head -1) 2>/dev/null || true
            sleep 3
            # Source env vars and start app
            source .env
            nohup java -Xmx512m -Xms256m -jar target/pochampally-backend-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
            sleep 10
            # Save the real PID by finding the running java process
            pgrep -f 'java.*pochampally-backend' | head -1 > app.pid
            # Verify app started
            if [ -s app.pid ] && kill -0 $(cat app.pid) 2>/dev/null; then
              echo "App started successfully (PID: $(cat app.pid))"
            else
              echo "App failed to start. Last logs:"
              tail -20 app.log
              exit 1
            fi
