name: Deploy to Dev

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Dev EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_DEV_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          script: |
            export JAVA_HOME=/usr/lib/jvm/java-21-amazon-corretto.x86_64
            export PATH=$JAVA_HOME/bin:$PATH
            cd /home/ec2-user/handmade-mini-backend
            git pull origin dev
            mvn clean package -DskipTests
            # Kill existing app (by PID to avoid killing SSH session)
            PID=$(pgrep -f 'java.*pochampally-backend' || true)
            if [ -n "$PID" ]; then
              kill $PID
              sleep 2
            fi
            # Source env vars and start app
            source .env
            nohup java -Xmx512m -Xms256m -jar target/pochampally-backend-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
            sleep 5
            # Verify app started
            if pgrep -f 'java.*pochampally-backend' > /dev/null; then
              echo "App started successfully"
            else
              echo "App failed to start. Last logs:"
              tail -20 app.log
              exit 1
            fi
