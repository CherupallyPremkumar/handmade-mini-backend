server:
  port: ${PORT:8090}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: homebase_db
        format_sql: false
    open-in-view: false

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: homebase_db
    contexts: ${LIQUIBASE_CONTEXTS:dev}

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

  jackson:
    default-property-inclusion: non_null

# Cloudflare R2 (S3-compatible) image storage
cloudflare:
  r2:
    account-id: ${CF_ACCOUNT_ID:not-configured}
    access-key: ${CF_R2_ACCESS_KEY:not-configured}
    secret-key: ${CF_R2_SECRET_KEY:not-configured}
    bucket: ${CF_R2_BUCKET:homebase_db-images}
    public-domain: ${CF_R2_PUBLIC_DOMAIN:localhost}

# Email Provider (ses or resend) — switch via EMAIL_PROVIDER env var
email:
  provider: ${EMAIL_PROVIDER:resend}

# Resend (default — works immediately, 3k emails/month free)
resend:
  api-key: ${RESEND_API_KEY:}
  from-email: ${RESEND_FROM_EMAIL:}

# AWS SES (alternative — needs production access approval)
aws:
  region: ${AWS_REGION:ap-south-1}
  ses:
    access-key: ${SES_ACCESS_KEY:}
    secret-key: ${SES_SECRET_KEY:}
    region: ${SES_REGION:ap-south-1}
    from-email: ${SES_FROM_EMAIL:}
  lambda:
    # Async video compression Lambda — empty = feature disabled (fallback: video uploaded as-is)
    video-compressor-arn: ${LAMBDA_VIDEO_COMPRESSOR_ARN:}
    # Shared secret for HMAC-SHA256 verification of Lambda webhook callbacks
    webhook-secret: ${LAMBDA_WEBHOOK_SECRET:}
    # Optional explicit credentials (falls back to default chain if empty — use EC2 IAM role in prod)
    access-key: ${AWS_LAMBDA_ACCESS_KEY:}
    secret-key: ${AWS_LAMBDA_SECRET_KEY:}

# Razorpay configuration
razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET}

# JWT Authentication
app:
  jwt-secret: ${JWT_SECRET}
  frontend-url: ${FRONTEND_URL:https://dhanunjaiah.com}
  cors-origins: ${CORS_ORIGINS}

# Logging
logging:
  level:
    com.homebase_db: INFO
    org.hibernate.SQL: WARN
